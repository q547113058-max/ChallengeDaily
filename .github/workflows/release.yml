name: Release

# 打 `vX.Y.Z` tag 后自动构建 Windows 安装包并创建 GitHub Release。
# electron-builder 的 --publish always 会读取 package.json 的 build.publish
# （provider: github）把 Setup.exe / Portable.exe / latest.yml / *.blockmap 一并上传。
#
# 前置条件：
#   1. 仓库需为 public（feed 选的是「当前仓库转公开」），否则客户端拉不到私有 Release 资产。
#   2. 本地 `client/package.json` 的 version 必须与 tag 一致（脚本会校验）。
#   3. Settings → Actions → General → Workflow permissions 需为 "Read and write permissions"。
#   4. 不打 tag 时可用 workflow_dispatch 手动跑一次（不会创建 Release，仅上传 artifacts）。
#   5. 随包默认后端配置（remote 地址 + token）由 Secrets 注入，源码不含任何凭据：
#      Settings → Secrets and variables → Actions 中添加
#        CD_BACKEND_URL    例如 http://193.112.246.85:5173
#        CD_BACKEND_TOKEN  对应 X-API-Token
#      未设置时打出的包保持 local 模式（client/build/backend-default.json 的占位值）。

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅构建并上传 artifacts，不创建 Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Type check
        working-directory: client
        run: npx tsc --noEmit

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        working-directory: client
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($pkg -ne $tag) {
            throw "Version mismatch: package.json=$pkg tag=$tag. 请先运行 npm run bump 或修改 tag。"
          }
          Write-Host "Version OK: $pkg"

      # 用 Secrets 覆盖占位文件，生成随包分发的默认后端配置。
      # 该文件会由 extraResources 打进 resources/backend-default.json，
      # 客户端首次启动即按 remote 模式连已部署后端；用户仍可在设置页覆盖。
      - name: Inject default backend config from Secrets
        shell: pwsh
        working-directory: client
        env:
          CD_BACKEND_URL: ${{ secrets.CD_BACKEND_URL }}
          CD_BACKEND_TOKEN: ${{ secrets.CD_BACKEND_TOKEN }}
        run: |
          if ($env:CD_BACKEND_URL -and $env:CD_BACKEND_TOKEN) {
            $cfg = @{
              mode  = 'remote'
              url   = $env:CD_BACKEND_URL.TrimEnd('/')
              token = $env:CD_BACKEND_TOKEN
            } | ConvertTo-Json -Depth 5
            # 用 UTF8Encoding($false) 避免 BOM（backend-config.cjs 已做防御，双保险）
            [System.IO.File]::WriteAllText(
              (Join-Path (Get-Location) 'backend-default.json'),
              $cfg,
              (New-Object System.Text.UTF8Encoding($false))
            )
            Write-Host "Default backend config injected (mode=remote). Token length: $($env:CD_BACKEND_TOKEN.Length)."
          } else {
            Write-Host "Secrets CD_BACKEND_URL / CD_BACKEND_TOKEN not both set; keeping local-mode placeholder."
          }

      - name: Build frontend + create installer, publish to GitHub Release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        working-directory: client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish:win

      - name: Build frontend + create installer (dry run, no publish)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        working-directory: client
        run: npm run build

      - name: Upload build artifacts (always, for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: ChallengeDaily-win-x64
          path: |
            client/dist-electron/*.exe
            client/dist-electron/*.yml
            client/dist-electron/*.blockmap
          if-no-files-found: warn
          retention-days: 14
