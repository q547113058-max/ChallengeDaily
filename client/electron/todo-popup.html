<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>待办审批</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden;
    font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; }
  #card {
    width: 100%; height: 100%; border-radius: 14px; padding: 16px 16px 12px;
    background: #ffffff; border: 1px solid #e5e7eb;
    box-shadow: 0 12px 36px rgba(0,0,0,.22), 0 2px 8px rgba(0,0,0,.12);
    display: none; flex-direction: column; color: #1f2937;
  }
  #card.show { display: flex; }
  .top { display: flex; align-items: flex-start; gap: 8px; }
  .spark { color: #7c5cff; font-size: 16px; line-height: 1.2; }
  .title { flex: 1; font-size: 12px; font-weight: 700; color: #7c5cff; }
  .x { width: 22px; height: 22px; border: 0; background: transparent; cursor: pointer;
       color: #9ca3af; font-size: 16px; line-height: 1; border-radius: 6px; }
  .x:hover { background: #f3f4f6; color: #4b5563; }
  .todo { font-size: 14px; font-weight: 600; line-height: 1.45; margin: 8px 0 6px;
          display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { font-size: 11px; color: #6b7280; }
  .basis { font-size: 11px; color: #9ca3af; font-style: italic; margin-top: 3px;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  button.act { flex: 1; height: 36px; border-radius: 9px; font-size: 13px; font-weight: 600;
               cursor: pointer; border: 1px solid transparent; }
  .ok { background: #7c5cff; color: #fff; }
  .ok:hover { background: #6d4df0; }
  .no { background: #fff; color: #374151; border-color: #e5e7eb; }
  .no:hover { background: #f9fafb; }
  button:disabled { opacity: .55; cursor: default; }
  .foot { display: flex; align-items: center; justify-content: center; gap: 5px;
          font-size: 11px; color: #9ca3af; margin-top: 8px; }
  .bar { height: 4px; border-radius: 999px; background: #f3f4f6; margin-top: 7px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 100%; background: #7c5cff;
             transition: width 1s linear; }
  #empty { height: 100%; display: flex; align-items: center; justify-content: center;
           color: #9ca3af; font-size: 12px; }
</style>
</head>
<body>
<div id="empty" style="display:none"></div>
<div id="card">
  <div class="top">
    <span class="spark">✦</span>
    <span class="title">识别到一条新待办 · 待确认</span>
    <button class="x" id="x" title="暂不处理">✕</button>
  </div>
  <div class="todo" id="todo"></div>
  <div class="meta" id="meta"></div>
  <div class="basis" id="basis"></div>
  <div class="spacer"></div>
  <div class="btns">
    <button class="act ok" id="ok">✓ 加入待办</button>
    <button class="act no" id="no">✕ 忽略</button>
  </div>
  <div class="foot"><span>◷</span><span id="clock">05:00</span><span> 后未处理将自动忽略</span></div>
  <div class="bar"><i id="barfill"></i></div>
</div>

<script>
(function () {
  var current = null, left = 0, timer = null, busy = false;
  var $ = function (id) { return document.getElementById(id); };

  function mmss(s) {
    var m = Math.floor(s / 60), x = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x;
  }

  function render(d) {
    if (timer) { clearInterval(timer); timer = null; }
    current = d;
    if (!d) { $('card').classList.remove('show'); return; }
    $('todo').textContent = d.todo || '';
    $('meta').textContent = (d.project || 'ChallengeDaily') + ' · ' +
      (d.confidence === 'high' ? '高置信' : '中等置信');
    $('basis').textContent = d.basis ? ('依据：' + d.basis) : '';
    left = d.ttl || 300;
    $('clock').textContent = mmss(left);
    $('barfill').style.width = '100%';
    $('card').classList.add('show');
    busy = false; $('ok').disabled = false; $('no').disabled = false;
    timer = setInterval(function () {
      left = Math.max(0, left - 1);
      $('clock').textContent = mmss(left);
      $('barfill').style.width = ((left / (d.ttl || 300)) * 100) + '%';
      if (left === 0) { clearInterval(timer); timer = null; window.todoPopup.dismiss(); }
    }, 1000);
  }

  function decide(action) {
    if (!current || busy) return;
    busy = true; $('ok').disabled = true; $('no').disabled = true;
    window.todoPopup.decide(current.id, action);
    if (timer) { clearInterval(timer); timer = null; }
  }

  $('ok').onclick = function () { decide('approve'); };
  $('no').onclick = function () { decide('reject'); };
  $('x').onclick = function () { if (timer) { clearInterval(timer); timer = null; } window.todoPopup.dismiss(); };

  window.todoPopup.onData(render);
  window.todoPopup.ready();
})();
</script>
</body>
</html>
