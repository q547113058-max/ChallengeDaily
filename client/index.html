<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- P39: X-Content-Type-Options 防止 MIME 嗅探 -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- P39: X-Frame-Options 防止点击劫持 -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <!-- P39: Referrer-Policy 控制引荐来源泄露 -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <!-- P39: Permissions-Policy 限制浏览器 API 访问 -->
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet" />
    <!--
      CSP 由 electron/csp.cjs 单点生成，构建/开发期由 vite.config.js 的 injectCSP
      插件替换下面这个占位符。请勿在此手写 CSP —— 否则会与响应头 CSP 各写一份，
      改一处漏一处将导致打包后请求被拦。
    -->
    <!--CSP_META-->
    <title>ChallengeDaily</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
